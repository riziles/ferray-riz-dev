[package]
name = "ferray-ufunc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Universal functions and SIMD-accelerated elementwise operations for ferray"

[dependencies]
ferray-core = { workspace = true }
pulp = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }
# CORE-MATH provides correctly-rounded transcendentals for native targets.
# On wasm32, core-math-sys → bindgen → libclang does not resolve, so we
# swap in the pure-Rust `libm` crate instead (see cr_math.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
core-math = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
libm = { workspace = true }

[dependencies.half]
workspace = true
optional = true

[dependencies.ferray-fft]
workspace = true
optional = true

[features]
default = []
f16 = ["dep:half", "ferray-core/f16"]
# Enables an O(n log n) FFT-based fast path inside `fftconvolve` for
# large f32/f64 inputs. The default `convolve` function stays direct
# (matching NumPy's contract) regardless of this feature.
fft-convolve = ["dep:ferray-fft"]

[dev-dependencies]
proptest = { workspace = true }
ferray-test-oracle = { path = "../ferray-test-oracle" }
serde = { workspace = true }
serde_json = "1.0"
toml = "0.8"
